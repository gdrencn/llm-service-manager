[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-service-manager"
dynamic = ["version"]
description = "Manage local Ollama, llama.cpp and Strata services with shared configuration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
llmsm = "llm_service_manager.__main__:entry"

[tool.setuptools.packages.find]
include = ["llm_service_manager*", "inline_ui*"]

[tool.setuptools.dynamic]
version = {attr = "llm_service_manager.__version__"}

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
